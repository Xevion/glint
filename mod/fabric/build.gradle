plugins {
    id 'org.jetbrains.kotlin.jvm'
    alias libs.plugins.shadow
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the plugin, allows distinct configurations
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }

    modImplementation libs.fabric.loader
    modApi libs.fabric.api

    modImplementation libs.architectury.fabric

    modImplementation libs.mixinextras.fabric

    modImplementation libs.kotlin.stdlib
    modImplementation libs.kotlinx.coroutines.core
    modImplementation libs.kotlinx.serialization.core
    modImplementation libs.kotlinx.serialization.json

    // Bundle dependencies into the mod JAR
    include libs.kotlin.stdlib
    include libs.kotlinx.coroutines.core
    include libs.kotlinx.serialization.core
    include libs.kotlinx.serialization.json
    include libs.webp.imageio

    implementation libs.webp.imageio

    modCompileOnly libs.iris
    modCompileOnly libs.sodium

    // Include Iris + Sodium in dev environment for smoke testing
    modLocalRuntime libs.iris
    modLocalRuntime libs.sodium

    // Iris transitive dependencies (not resolved from Modrinth JAR)
    modLocalRuntime libs.jcpp
    modLocalRuntime libs.glsl.transformer

    // owo-lib UI framework (users must install separately)
    modApi libs.owo.fabric
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}
