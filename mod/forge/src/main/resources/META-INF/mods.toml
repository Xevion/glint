modLoader = "javafml"
loaderVersion = "[49,)"
license = "MIT"

[[mods]]
modId = "glint"
version = "${version}"
displayName = "Glint"
description = "A Minecraft mod built with Architectury"

[[dependencies.glint]]
modId = "forge"
type = "required"
versionRange = "[54,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.glint]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.4]"
ordering = "NONE"
side = "BOTH"

[[dependencies.glint]]
modId = "architectury"
type = "required"
versionRange = "[15.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "glint.mixins.json"
