scalar ShaderId

type ShaderNode {
	id: ShaderId!
	name: String!
	slug: String!
	description: String
	modrinthId: String
	curseforgeId: String
	websiteUrl: String
	iconUrl: String
	sourceUrl: String
	licenseId: String
	upstreamDownloads: Int
	upstreamUpdatedAt: DateTime
	lastSyncedAt: DateTime
	createdAt: DateTime!
	updatedAt: DateTime!
	viewCount: Int!
	"""
	All versions of this shader, ordered by publish date descending.
	"""
	versions: [ShaderVersionDetailNode!]!
	"""
	Authors attributed to this shader from upstream platforms.
	"""
	authors: [ShaderAuthorNode!]!
	"""
	Categories (style tags) associated with this shader.
	"""
	categories: [CategoryNode!]!
	"""
	Feature tags associated with this shader.
	"""
	features: [FeatureNode!]!
	"""
	Latest version string (e.g. "1.7.2") for display purposes.
	"""
	latestVersion: String
	"""
	Representative thumbnail image path for this shader.
	"""
	imagePath: String
	"""
	Thumbhash placeholder for the representative thumbnail.
	"""
	thumbhash: String
	"""
	Total number of versions for this shader.
	"""
	versionCount: Int!
	"""
	Extraction summary across all versions.
	"""
	extractionSummary: ExtractionSummaryNode
	"""
	Completed captures for this shader, optionally filtered by version and profile.

	Returns one capture per scene (deduplication via `CaptureDistinct::PerScene`),
	matching the behavior of the REST shader detail endpoint.
	"""
	captures(
		"""
		Filter to a specific shader version. Defaults to the latest version.
		"""
		versionId: String
		"""
		Filter to a specific profile within the version.
		"""
		profileId: String
	): [CaptureWithContextNode!]!
	"""
	Profiles for this shader, optionally filtered to a specific version.

	Defaults to the latest version's profiles when no `version_id` is given.
	"""
	profiles(
		"""
		Filter to a specific shader version. Defaults to the latest version.
		"""
		versionId: String
	): [ShaderVersionProfileNode!]!
	"""
	Extracted metadata for this shader, optionally for a specific version.

	Defaults to the latest version's metadata when no `version_id` is given.
	"""
	metadata(
		"""
		Filter to a specific shader version. Defaults to the latest version.
		"""
		versionId: String
	): ShaderVersionMetadataNode
}

