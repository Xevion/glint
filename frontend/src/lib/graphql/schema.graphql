"""
Root query type — merges all domain query types.
"""
type QueryRoot {
	"""
	List scenes with cursor-based pagination.
	"""
	scenes(
		"""
		Number of items to return (max 100)
		"""
		first: Int! = 20,
		"""
		Cursor from a previous page's endCursor
		"""
		after: String,
		"""
		Filter inactive scenes: EXCLUDE (default, active only), INCLUDE (all, admin), ONLY (inactive only, admin)
		"""
		visibility: Visibility! = EXCLUDE
	): SceneNodeConnection!
	"""
	Get a single scene by ID or slug.
	"""
	scene(
		"""
		Scene ID (nanoid) or slug
		"""
		id: String!
	): SceneNode
	"""
	Paginated list of shaders with cursor pagination.
	
	Use `visibility` to control which shaders are returned:
	- `EXCLUDE` (default): only shaders with completed captures (public).
	- `INCLUDE`: all shaders including disabled/uncaptured (requires admin).
	- `ONLY`: only hidden shaders without captures (requires admin).
	"""
	shaders(
		"""
		Number of items to return (max 100)
		"""
		first: Int! = 20,
		"""
		Cursor from a previous page's endCursor
		"""
		after: String,
		"""
		Search by name
		"""
		search: String,
		"""
		Sort: popular, name, or default (recent)
		"""
		sort: String,
		"""
		Filter hidden items: EXCLUDE (default, public), INCLUDE (all, admin), ONLY (hidden only, admin)
		"""
		visibility: Visibility! = EXCLUDE
	): ShaderNodeConnection!
	"""
	Get a shader by ID or slug with full detail.
	
	Returns a `ShaderNode` whose nested fields (versions, authors) are
	resolved on demand via `ComplexObject` resolvers.
	"""
	shader(
		"""
		Shader ID (nanoid) or slug
		"""
		id: String!
	): ShaderNode
	"""
	Trending shaders by recent view count.
	"""
	trendingShaders(
		"""
		Number of days to consider (1-90)
		"""
		days: Int! = 7,
		"""
		Number of items to return (max 100)
		"""
		first: Int! = 20
	): [TrendingShaderNode!]!
	"""
	Paginated list of completed captures (public).
	"""
	captures(
		"""
		Number of items to return (max 100)
		"""
		first: Int! = 20,
		"""
		Cursor from a previous page's endCursor
		"""
		after: String
	): CaptureNodeConnection!
	"""
	Capture health summary — target matrix completion status (admin).
	"""
	captureHealth: CaptureHealthNode!
	"""
	Recent completed captures with full context (admin).
	"""
	recentCaptures(
		"""
		Number of recent captures to return
		"""
		count: Int! = 5
	): [CaptureWithContextNode!]!
	"""
	Cursor-paginated list of captures with rich filtering (admin).
	"""
	adminCaptures(
		"""
		Number of items to return (max 100)
		"""
		first: Int! = 25,
		"""
		Cursor from a previous page's endCursor
		"""
		after: String,
		"""
		Sort: capturedAt, fileSizeBytes, shaderName (prefix - for desc)
		"""
		sort: String,		filters: AdminCaptureFiltersInput
	): CaptureWithContextNodeConnection!
	"""
	Aggregate counts for the index page.
	"""
	stats: StatsNode!
	"""
	Random popular shader pairs for homepage hero.
	"""
	featured(
		"""
		Number of pairs to return
		"""
		count: Int! = 6
	): [FeaturedPairNode!]!
	"""
	List enabled backgrounds (public, for frontend layout).
	"""
	backgrounds: [BackgroundNode!]!
	"""
	List all backgrounds including disabled (admin only).
	"""
	allBackgrounds: [BackgroundNode!]!
	"""
	Cursor-paginated list of capture runs with optional filtering (admin only).
	"""
	adminCaptureRuns(
		"""
		Number of items to return (max 100)
		"""
		first: Int! = 25,
		"""
		Cursor from a previous page's endCursor
		"""
		after: String,
		"""
		Sort: startedAt, durationSecs, status, totalItems (prefix - for desc)
		"""
		sort: String,		filters: AdminRunFiltersInput
	): CaptureRunListNodeConnection!
	"""
	Get a capture run by ID with all items (admin only).
	"""
	adminCaptureRun(
		"""
		Capture run ID
		"""
		id: String!
	): CaptureRunNode
	"""
	Storage statistics — total bytes, counts, averages (admin).
	"""
	storageStats: StorageStatsNode!
	"""
	Storage growth time series (admin).
	"""
	storageGrowth(
		"""
		Number of days to look back
		"""
		days: Int! = 90,
		"""
		Interval in hours for each bucket
		"""
		intervalHours: Int! = 1
	): [StorageBucketNode!]!
}

