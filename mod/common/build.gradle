plugins {
    id 'org.jetbrains.kotlin.jvm'
    alias libs.plugins.kotlin.serialization
    alias libs.plugins.test.logger
}

architectury {
    common('fabric', 'neoforge')
}

sourceSets {
    test {
        kotlin.srcDirs('src/test/kotlin')
    }
}

dependencies {
    compileOnly libs.mixin
    compileOnly libs.mixinextras.common
    annotationProcessor libs.mixinextras.common

    compileOnly libs.fabric.loader

    modApi libs.slf4j.api

    modImplementation libs.kotlin.stdlib
    modImplementation libs.kotlinx.coroutines.core
    modImplementation libs.kotlinx.serialization.core
    modImplementation libs.kotlinx.serialization.json

    implementation libs.webp.imageio

    // Iris integration - compile-time only, not bundled
    modCompileOnly libs.iris

    // owo-lib UI framework - use Fabric version in common since both platforms share the same API
    modCompileOnlyApi(libs.owo.fabric) {
        exclude group: 'net.fabricmc.fabric-api'
    }

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation libs.kotlinx.serialization.json
}

test {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
}

testlogger {
    theme 'standard'
    showExceptions true
    showStackTraces true
    showCauses true
    showPassed true
    showSkipped true
    showFailed true
    showSummary true
    logLevel 'quiet'
}
