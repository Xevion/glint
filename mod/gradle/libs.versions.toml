[versions]
minecraft = "1.21.4"
fabric-loader = "0.16.9"
fabric-api = "0.116.1+1.21.4"
forge = "1.21.4-54.1.0"
neoforge = "21.4.156"
architectury-plugin = "3.4-SNAPSHOT"
architectury-loom = "1.11-SNAPSHOT"
architectury-api = "15.0.3"

mixin = "0.8.7"
mixinextras = "0.4.1"

# Iris Shaders (Modrinth Maven uses version_number from API)
iris = "1.8.8+1.21.4-fabric"
sodium = "mc1.21.4-0.6.13-fabric"

kotlin = "2.2.21"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.8.0"

slf4j = "2.0.17"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
forge = { module = "net.minecraftforge:forge", version.ref = "forge" }
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }
architectury-fabric = { module = "dev.architectury:architectury-fabric", version.ref = "architectury-api" }
architectury-forge = { module = "dev.architectury:architectury-forge", version.ref = "architectury-api" }
architectury-neoforge = { module = "dev.architectury:architectury-neoforge", version.ref = "architectury-api" }

mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
mixinextras-fabric = { module = "io.github.llamalad7:mixinextras-fabric", version.ref = "mixinextras" }
mixinextras-forge = { module = "io.github.llamalad7:mixinextras-forge", version.ref = "mixinextras" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

iris = { module = "maven.modrinth:iris", version.ref = "iris" }
sodium = { module = "maven.modrinth:sodium", version.ref = "sodium" }

[plugins]
architectury = { id = "architectury-plugin", version.ref = "architectury-plugin" }
architectury-loom = { id = "dev.architectury.loom", version.ref = "architectury-loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
