[package]
name = "glint"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
aws-sdk-s3 = { version = "1.118.0", default-features = false, features = ["sigv4a", "http-1x", "rustls", "rt-tokio"] }
axum = { version = "0.8.7", features = ["macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.56", features = ["derive"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "migrate", "chrono", "macros", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }

# OAuth / HTTP client
axum-extra = { version = "0.10", features = ["cookie"] }
oauth2 = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.9"
hex = "0.4"
time = { version = "0.3.47", features = ["formatting", "macros"] }
serde_repr = "0.1.20"
url = "2.5.8"
nanoid = "0.4.0"
thumbhash = "0.1.0"
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
base64 = "0.22.1"
posthog-rs = "0.4.0"
tower = { version = "0.5.3", features = ["util"] }
validator = { version = "0.20.0", features = ["derive"] }
paste = "1.0.15"
ulid = "1.2.1"
governor = "0.10.4"
subtle = "2.6.1"
sha2 = "0.10.9"
mini-moka = "0.10.3"
dashmap = "6.1.0"
serde_with = "3.16.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
custom_debug_derive = "0.6.2"
tokio-util = { version = "0.7.18", features = ["rt"] }
form_urlencoded = "1.2.2"
async-graphql = { version = "7.2.1", features = ["chrono"] }
async-graphql-axum = "7.2.1"
tokio-stream = { version = "0.1.18", features = ["sync"] }
async-stream = "0.3.6"

[dev-dependencies]
assert2 = "0.3.16"
rstest = "0.26.1"
serde_urlencoded = "0.7.1"
