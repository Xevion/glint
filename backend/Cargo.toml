[package]
name = "glint"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
aws-sdk-s3 = "1.118.0"
axum = { version = "0.8.7", features = ["macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.56", features = ["derive"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "migrate", "chrono", "macros"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }

# OAuth / HTTP client
axum-extra = { version = "0.10", features = ["cookie"] }
oauth2 = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.9"
hex = "0.4"
time = { version = "0.3.47", features = ["formatting", "macros"] }
serde_repr = "0.1.20"
url = "2.5.8"
nanoid = "0.4.0"
thumbhash = "0.1.0"
image = { version = "0.25.9", default-features = false, features = ["avif-native", "png", "webp"] }
base64 = "0.22.1"
posthog-rs = "0.4.0"
tower = { version = "0.5.3", features = ["util"] }
validator = { version = "0.20.0", features = ["derive"] }
paste = "1.0.15"
